*{box-sizing:border-box;margin:0}html,body{background:var(--bg)}

.logo{display:block;width:126px;margin:24px auto 0;mix-blend-mode:screen}
.brand{text-align:center;font-size:13.5px;letter-spacing:.3em;line-height:1.9;color:#b6c6ee;margin:18px 0 22px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:6px;padding:0 0 0 18px}
.nav button{display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;border:1px solid transparent;border-radius:14px 0 0 14px;background:none;font-size:16.5px;font-weight:500;text-align:left;color:#e3ebff}
.nav button .i{font-size:23px;color:#c6d4f5}
.nav button.on{background:linear-gradient(90deg,#1c5fe6,#3b4fe0);border-color:#4aa3ff;box-shadow:0 0 22px #2f7bff66;font-weight:700}
.nav button.on .i{color:#fff}

.art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030a1c 0,#030a1c00 45%),linear-gradient(180deg,#030a1c 0,#030a1c00 40%)}
.ttl{position:absolute;left:0;top:44px;padding-left:34px}.ttl:before{content:"";position:absolute;left:0;top:14px;width:4px;height:82px;background:var(--c);border-radius:3px;box-shadow:0 0 12px var(--c)}
.kick{font-size:15px;font-weight:700;letter-spacing:.22em;color:var(--c);margin-bottom:2px}
h1{font-size:50px;font-weight:800;letter-spacing:-.01em;line-height:1.1;text-shadow:0 0 24px #2f7bff66}
.sub{font-size:19px;color:#d0dbf5;margin-top:4px}
.top{position:absolute;right:0;top:17px;display:flex;align-items:center;gap:26px}
.pill,.sel{display:flex;align-items:center;gap:12px;height:46px;padding:0 22px;border:1px solid #2b5cc4;border-radius:14px;background:#0b1a47cc;font-size:16.5px;font-weight:500;position:relative}
.top .pill{height:41px;font-size:16px;padding:0 17px;gap:10px}
.bell{background:none;border:0;font-size:26px;color:#dfe8ff}.av{width:50px;height:50px;border-radius:50%;background:#8b5cf6;border:0;font-weight:700;font-size:18px}
.fil{position:absolute;left:0;right:0;bottom:0;display:flex;gap:18px;align-items:center}
.sel{padding:0 18px 0 31px;gap:36px;justify-content:space-between;min-width:190px;background:#0b1a47}.sel select,.sel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;color-scheme:dark}
.sel select option{background:#0b1a47}
.nb{border:0;color:#fff;height:46px;border-radius:14px;padding:0 26px;font-weight:600;font-size:17px;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#1b6df0,#16a6f2);box-shadow:0 0 22px #2f9bff88;margin-left:auto}
.nb.g{background:#0b1a47;border:1px solid #2b5cc4;box-shadow:none;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:22px}
.kpi{position:relative;height:145px;border-radius:22px;border:1.5px solid var(--k);background:linear-gradient(135deg,color-mix(in srgb,var(--k) 26%,#07143a),#071337 70%);box-shadow:0 0 24px color-mix(in srgb,var(--k) 35%,transparent),inset 0 0 30px color-mix(in srgb,var(--k) 10%,transparent);padding:20px 22px;overflow:hidden}
.ic{position:absolute;left:22px;top:18px;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 70%,#fff),var(--k));display:grid;place-items:center;font-size:30px;box-shadow:0 0 18px color-mix(in srgb,var(--k) 60%,transparent)}
.kpi .l{margin-left:86px;font-size:17px;color:#d3def7}.kpi .n{margin:4px 0 0 86px;font-size:41px;font-weight:800;letter-spacing:-.01em}
.kpi svg.sp{position:absolute;right:16px;bottom:10px;width:56%;height:46px}
.row{display:grid;gap:24px;margin-top:24px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 330px}
.panel{border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#0c2260cc,#071337f0 60%);box-shadow:0 0 26px #2f7bff30,inset 0 0 40px #2f7bff12;padding:18px 22px;position:relative}

function migrate(){const b=JSON.parse(localStorage.getItem(BK)||"{}"),pj=k=>{try{return JSON.parse(b[k])}catch(_){return null}},dt=/^\d{4}-\d{2}-\d{2}$/,I=Number.isInteger;

/* PDT Orion detail module: separate from aggregated PS8. */
let pdtItems=[];
const pdtCols=['process_date','process_time','user_orion','real_awb','awb_dest','manifest_status','bag_indication','bag_dest','check_status','region','service','source_file'];
const pdtLabels=['TGL PROSES','JAM PROSES','USER ORION','REAL AWB','AWB DEST','STATUS','INDIKASI BAG','BAG DEST','CHECK','REGION','SERVICE','SOURCE FILE'];
const pdtEscape=v=>esc(String(v??''));
const pdtPeriod=()=>opsPeriod();
const pdtVisible=()=>{let {from,to}=pdtPeriod();return pdtItems.filter(r=>r.process_date>=from&&r.process_date<=to&&(opsLine==='ALL'||r.region===opsLine));};
const pdtRegions=()=>[...new Set(pdtItems.map(r=>r.region).filter(Boolean))].sort();
const pdtSelect=()=>`<div class="ops-filter"><input type="date" class="field" id="opsDate" value="${pdtEscape(opsDate)}"><select id="opsDays" class="field">${[1,7,30].map(n=>`<option value="${n}" ${opsDays===n?'selected':''}>${n} Hari</option>`).join('')}</select><select id="opsLine" class="field"><option value="ALL">Semua REGION</option>${pdtRegions().map(x=>`<option value="${pdtEscape(x)}" ${opsLine===x?'selected':''}>${pdtEscape(x)}</option>`).join('')}</select></div>`;
const pdtRender=()=>{if(view!=='pdt')return;const root=$('view-pdt');if(!root)return;const rows=pdtVisible(),reg=new Map();rows.forEach(r=>reg.set(r.region,(reg.get(r.region)||0)+1));root.innerHTML=`<div class="ops-hero"><div class="ux-kicker">OPERATIONS INTELLIGENCE · ORION</div><h2>Mirroring PDT · Keylogger Orion</h2><p class="ops-note">Data temuan per AWB. REGION tidak disamakan dengan LINE. Tidak digabung atau dijumlahkan ulang dengan PS8.</p></div>${pdtSelect()}<div class="ops-actions"><button class="ux-button gradient" id="pdtUpload">↥ Upload Excel / CSV</button><button class="ux-button teal" id="pdtManual">＋ Input Manual</button><button class="ux-button" id="pdtTemplate">↓ Template CSV</button><button class="ux-button" id="pdtExport">↓ Ekspor CSV</button></div><div class="ops-grid">${opsKpi('Total Temuan AWB',fmt(rows.length),'Satu AWB per tanggal')}${opsKpi('REGION tercatat',fmt(reg.size),'Dalam periode')}${opsKpi('Tanggal tercatat',fmt(new Set(rows.map(r=>r.process_date)).size),'Dalam periode')}</div><div class="ops-section"><h3>Temuan per REGION</h3>${opsBars([...reg].map(([name,total])=>({name:name||'—',total})).sort((a,b)=>b.total-a.total))}</div><div class="ops-section"><h3>Detail Keylogger Orion</h3><div class="ops-tablewrap"><table class="ops-table"><thead><tr>${['Tanggal','Jam','User Orion','REAL AWB','AWB Dest','Status','Indikasi Bag','Bag Dest','Check','REGION','Service','Aksi'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice().sort((a,b)=>b.process_date.localeCompare(a.process_date)).map(r=>`<tr>${pdtCols.slice(0,11).map(k=>`<td>${pdtEscape(r[k])}</td>`).join('')}<td>${S.role==='admin'?`<button class="btn" data-pdt-edit="${r.id}">Edit</button> <button class="btn danger" data-pdt-delete="${r.id}">Hapus</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="12" class="ops-empty">Belum ada data pada periode ini.</td></tr>'}</tbody></table></div></div>`;
root.querySelector('#opsDate').onchange=e=>{opsDate=e.target.value;pdtRender()};root.querySelector('#opsDays').onchange=e=>{opsDays=Number(e.target.value);pdtRender()};root.querySelector('#opsLine').onchange=e=>{opsLine=e.target.value;pdtRender()};
root.querySelector('#pdtUpload').onclick=pdtImport;root.querySelector('#pdtManual').onclick=()=>pdtForm();root.querySelector('#pdtTemplate').onclick=pdtTemplate;root.querySelector('#pdtExport').onclick=pdtExport;
root.querySelectorAll('[data-pdt-edit]').forEach(b=>b.onclick=()=>pdtForm(pdtItems.find(r=>r.id===Number(b.dataset.pdtEdit))));root.querySelectorAll('[data-pdt-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus data AWB ini?'))return;try{let {error}=await sb.from('pdt_keylogger').delete().eq('id',Number(b.dataset.pdtDelete));if(error)throw error;await pdtLoad();pdtRender();toast('Data dihapus')}catch(e){alert('Gagal menghapus: '+e.message)}});
};
const pdtLoad=async()=>{pdtItems=await all('pdt_keylogger','*','id')};
const pdtDate=(value,year)=>{let v=String(value||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{1,2})[\s\/-]([a-zA-Z]{3,}|\d{1,2})(?:[\s\/-](\d{2,4}))?$/);if(!m)return '';const months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];let mo=/^\d+$/.test(m[2])?Number(m[2]):months.indexOf(m[2].toLowerCase().slice(0,3))+1;let y=m[3]?Number(m[3]):year;if(y<100)y+=2000;let d=Number(m[1]);if(mo<1||mo>12||d<1||d>31)return '';let iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const dt=new Date(iso+'T00:00:00Z');return !Number.isNaN(dt.valueOf())&&dt.toISOString().slice(0,10)===iso?iso:''};
const pdtParse=(rows,year,filename)=>{const keys={'USER ORION':'user_orion','TGL PROSES':'process_date','JAM PROSES':'process_time','REAL AWB':'real_awb','AWB DEST':'awb_dest','STATUS':'manifest_status','STATUS UN MANIFEST':'manifest_status','INDIKASI BAG':'bag_indication','BAG DEST':'bag_dest','CHECK':'check_status','CHECK UN-CONFIRM':'check_status','REGION':'region','SERVICE':'service'};let header=null,out=[],invalid=0,duplicates=0,seen=new Set();for(const row of rows){let vals=row.map(x=>String(x??'').trim());if(!header){const found=vals.map(x=>keys[x.toUpperCase().replace(/\s+/g,' ')]||'');if(found.includes('process_date')&&found.includes('real_awb'))header=found;continue}if(!vals.some(Boolean))continue;let r=Object.fromEntries(pdtCols.map(k=>[k,'']));header.forEach((k,i)=>{if(k)r[k]=vals[i]||''});r.process_date=pdtDate(r.process_date,year);r.source_file=filename;let key=r.process_date+'|'+r.real_awb;if(!r.process_date||!r.real_awb){invalid++;continue}if(seen.has(key)){duplicates++;continue}seen.add(key);out.push(r)}if(!header)throw Error('Header TGL PROSES dan REAL AWB tidak ditemukan');return {rows:out,invalid,duplicates}};
const pdtSheet=async file=>{if(/\.csv$/i.test(file.name))return userParseCsv((await file.text()).replace(/^\ufeff/,''));if(!/\.xlsx?$/i.test(file.name))throw Error('Gunakan CSV atau Excel');if(!window.XLSX){let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';await new Promise((ok,fail)=>{sc.onload=ok;sc.onerror=fail;document.head.append(sc)})}let wb=XLSX.read(await file.arrayBuffer(),{type:'array',raw:false});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})};
function pdtImport(){if(S.role!=='admin')return alert('Hanya admin yang dapat mengimpor');let pending=[];opsDialog('Impor Keylogger Orion',`<p class="ops-note">Pilih file CSV/Excel Orion berisi TGL PROSES, REAL AWB, USER ORION, STATUS, REGION dan kolom lainnya. Jika tanggal tidak memuat tahun, pastikan tahun di bawah sesuai.</p><label class="ops-note">Tahun data<input id="pdtYear" type="number" min="2000" max="2100" class="field" value="${Number(opsDate.slice(0,4))||new Date().getFullYear()}"></label><label class="ops-note">Pilih file<input id="pdtFile" type="file" accept=".csv,.xlsx,.xls" class="field" style="display:block;width:100%;margin-top:8px"></label><div id="pdtPreview" class="ops-note" style="margin:14px 0">Belum ada file dipilih.</div><div class="modal-actions"><button id="pdtCancel" class="btn">Batal</button><button id="pdtCommit" class="ux-button gradient" disabled>Impor Data</button></div>`);$('pdtCancel').onclick=()=>$('opsDialog').remove();let file=null;const prepare=async()=>{file=$('pdtFile').files[0];if(!file)return;try{let parsed=pdtParse(await pdtSheet(file),Number($('pdtYear').value),file.name);pending=parsed.rows;$('pdtPreview').innerHTML=`${pending.length} baris valid · ${parsed.invalid} tidak valid · ${parsed.duplicates} duplikat dalam file.<div class="ops-tablewrap"><table class="ops-table"><thead><tr><th>Tanggal</th><th>REAL AWB</th><th>REGION</th><th>Status</th></tr></thead><tbody>${pending.slice(0,10).map(r=>`<tr><td>${pdtEscape(r.process_date)}</td><td>${pdtEscape(r.real_awb)}</td><td>${pdtEscape(r.region)}</td><td>${pdtEscape(r.manifest_status)}</td></tr>`).join('')}</tbody></table></div>`;$('pdtCommit').disabled=!pending.length}catch(e){pending=[];$('pdtPreview').textContent='Gagal membaca: '+e.message;$('pdtCommit').disabled=true}};$('pdtFile').onchange=prepare;$('pdtYear').onchange=prepare;
$('pdtCommit').onclick=async()=>{if(!pending.length)return;const overlap=pending.filter(r=>pdtItems.some(x=>x.process_date===r.process_date&&x.real_awb===r.real_awb)).length;if(overlap&&!confirm(`${overlap} AWB pada tanggal yang sama sudah ada dan akan diperbarui. Lanjut?`))return;let btn=$('pdtCommit');btn.disabled=true;try{for(let i=0;i<pending.length;i+=200){const{error}=await sb.from('pdt_keylogger').upsert(pending.slice(i,i+200),{onConflict:'process_date,real_awb'});if(error)throw error}await pdtLoad();opsDate=pending[0].process_date;opsLine='ALL';$('opsDialog').remove();pdtRender();toast(`${pending.length} AWB berhasil diimpor`)}catch(e){alert('Gagal impor: '+e.message);btn.disabled=false}};}
function pdtForm(row){if(S.role!=='admin')return;const old=row||{},fields=pdtCols.slice(0,11);opsDialog(row?'Edit AWB':'Input AWB',`<form id="pdtForm" class="form-grid">${fields.map((k,i)=>`<label>${pdtLabels[i]}<input class="field" name="${k}" ${k==='process_date'?'type="date"':''} ${['process_date','real_awb'].includes(k)?'required':''} value="${pdtEscape(old[k]|| (k==='process_date'?opsDate:''))}"></label>`).join('')}<div class="modal-actions wide"><button type="button" class="btn" id="pdtCancel">Batal</button><button type="submit" class="ux-button gradient">Simpan</button></div></form>`);$('pdtCancel').onclick=()=>$('opsDialog').remove();$('pdtForm').onsubmit=async e=>{e.preventDefault();let r=Object.fromEntries(fields.map(k=>[k,e.target.elements[k].value.trim()]));r.source_file=old.source_file||'Input manual';try{const q=row?sb.from('pdt_keylogger').update(r).eq('id',row.id):sb.from('pdt_keylogger').insert(r);const {error}=await q;if(error)throw error;await pdtLoad();$('opsDialog').remove();pdtRender();toast('Data AWB tersimpan')}catch(e){alert('Gagal menyimpan: '+e.message)}};}
const pdtCsvCell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
const pdtCsv=rows=>[pdtLabels.join(','),...rows.map(r=>pdtCols.map(k=>pdtCsvCell(r[k])).join(','))].join('\r\n');
const pdtExport=()=>userDownload('JNE_Leguti_Keylogger_Orion.csv',pdtCsv(pdtVisible()));
const pdtTemplate=()=>userDownload('Template_Keylogger_Orion.csv',pdtCsv([]));
const _opsRenderOriginal=opsRender;opsRender=function(){if(view==='pdt')return pdtRender();return _opsRenderOriginal()};

})();
