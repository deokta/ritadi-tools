*{box-sizing:border-box;margin:0}html,body{background:var(--bg)}

.logo{display:block;width:126px;margin:24px auto 0;mix-blend-mode:screen}
.brand{text-align:center;font-size:13.5px;letter-spacing:.3em;line-height:1.9;color:#b6c6ee;margin:18px 0 22px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:6px;padding:0 0 0 18px}
.nav button{display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;border:1px solid transparent;border-radius:14px 0 0 14px;background:none;font-size:16.5px;font-weight:500;text-align:left;color:#e3ebff}
.nav button .i{font-size:23px;color:#c6d4f5}
.nav button.on{background:linear-gradient(90deg,#1c5fe6,#3b4fe0);border-color:#4aa3ff;box-shadow:0 0 22px #2f7bff66;font-weight:700}
.nav button.on .i{color:#fff}

.art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030a1c 0,#030a1c00 45%),linear-gradient(180deg,#030a1c 0,#030a1c00 40%)}
.ttl{position:absolute;left:0;top:44px;padding-left:34px}.ttl:before{content:"";position:absolute;left:0;top:14px;width:4px;height:82px;background:var(--c);border-radius:3px;box-shadow:0 0 12px var(--c)}
.kick{font-size:15px;font-weight:700;letter-spacing:.22em;color:var(--c);margin-bottom:2px}
h1{font-size:50px;font-weight:800;letter-spacing:-.01em;line-height:1.1;text-shadow:0 0 24px #2f7bff66}
.sub{font-size:19px;color:#d0dbf5;margin-top:4px}
.top{position:absolute;right:0;top:17px;display:flex;align-items:center;gap:26px}
.pill,.sel{display:flex;align-items:center;gap:12px;height:46px;padding:0 22px;border:1px solid #2b5cc4;border-radius:14px;background:#0b1a47cc;font-size:16.5px;font-weight:500;position:relative}
.top .pill{height:41px;font-size:16px;padding:0 17px;gap:10px}
.bell{background:none;border:0;font-size:26px;color:#dfe8ff}.av{width:50px;height:50px;border-radius:50%;background:#8b5cf6;border:0;font-weight:700;font-size:18px}
.fil{position:absolute;left:0;right:0;bottom:0;display:flex;gap:18px;align-items:center}
.sel{padding:0 18px 0 31px;gap:36px;justify-content:space-between;min-width:190px;background:#0b1a47}.sel select,.sel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;color-scheme:dark}
.sel select option{background:#0b1a47}
.nb{border:0;color:#fff;height:46px;border-radius:14px;padding:0 26px;font-weight:600;font-size:17px;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#1b6df0,#16a6f2);box-shadow:0 0 22px #2f9bff88;margin-left:auto}
.nb.g{background:#0b1a47;border:1px solid #2b5cc4;box-shadow:none;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:22px}
.kpi{position:relative;height:145px;border-radius:22px;border:1.5px solid var(--k);background:linear-gradient(135deg,color-mix(in srgb,var(--k) 26%,#07143a),#071337 70%);box-shadow:0 0 24px color-mix(in srgb,var(--k) 35%,transparent),inset 0 0 30px color-mix(in srgb,var(--k) 10%,transparent);padding:20px 22px;overflow:hidden}
.ic{position:absolute;left:22px;top:18px;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 70%,#fff),var(--k));display:grid;place-items:center;font-size:30px;box-shadow:0 0 18px color-mix(in srgb,var(--k) 60%,transparent)}
.kpi .l{margin-left:86px;font-size:17px;color:#d3def7}.kpi .n{margin:4px 0 0 86px;font-size:41px;font-weight:800;letter-spacing:-.01em}
.kpi svg.sp{position:absolute;right:16px;bottom:10px;width:56%;height:46px}
.row{display:grid;gap:24px;margin-top:24px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 330px}
.panel{border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#0c2260cc,#071337f0 60%);box-shadow:0 0 26px #2f7bff30,inset 0 0 40px #2f7bff12;padding:18px 22px;position:relative}

/* Analisis Gabungan: tabel kiri, grafik kanan */
.ops-compare-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.ops-compare-layout .ops-section{margin:0;min-width:0;height:100%}
.ops-compare-legend{display:flex;gap:15px;flex-wrap:wrap;color:#aebfe0;font-size:11px;margin:10px 0 17px}
.ops-compare-legend span{display:inline-flex;align-items:center;gap:7px}
.ops-compare-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:#3189ff;box-shadow:0 0 10px #3189ff70}
.ops-compare-legend .ps8 i{background:#16dec7;box-shadow:0 0 10px #16dec770}
.ops-compare-chart{display:grid;gap:12px;max-height:560px;overflow:auto;padding:3px 5px 5px 0}
.ops-compare-row{display:grid;grid-template-columns:minmax(74px,110px) minmax(0,1fr);align-items:center;gap:10px;font-size:11px}
.ops-compare-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d8e6ff;font-weight:700}
.ops-compare-tracks{display:grid;gap:5px}
.ops-compare-track{height:13px;border-radius:8px;background:#172c4b;position:relative;cursor:pointer;outline:none;touch-action:manipulation}
.ops-compare-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#235bdc,#4dafff);box-shadow:0 0 12px #3189ff70;min-width:0}
.ops-compare-fill.ps8{background:linear-gradient(90deg,#087f91,#1fe4c9);box-shadow:0 0 12px #16dec770}
.ops-compare-track::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);background:#103477;color:#f0f6ff;border:1px solid #438cff;border-radius:9px;box-shadow:0 5px 22px #146bff88;padding:8px 11px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;z-index:30;transition:opacity .15s,transform .15s}
.ops-compare-track:hover::after,.ops-compare-track:focus-visible::after,.ops-compare-track.tip-open::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.ops-compare-row{padding-top:9px}.ops-compare-tracks{overflow:visible}.ops-compare-chart{padding-top:28px;overflow-y:auto;overflow-x:visible}
.ops-compare-track:hover .ops-compare-fill,.ops-compare-track.tip-open .ops-compare-fill{filter:brightness(1.4);box-shadow:0 0 17px #3b95ff}
.ops-compare-note{font-size:11px;color:#93a9cc;margin:10px 0 0}
@media(max-width:1050px){.ops-compare-layout{grid-template-columns:1fr}}

body.ai-on .hero{height:76px;min-height:76px}
body.ai-on .art,body.ai-on .ttl{display:none}
#view-ai{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;height:calc(100vh - 112px);height:calc(100dvh - 112px);min-height:480px}
#view-ai[hidden]{display:none}
.ai-hist{display:flex;flex-direction:column;min-height:0;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#0c2260cc,#071337f0 60%);box-shadow:0 0 26px #2f7bff30,inset 0 0 40px #2f7bff12;padding:14px}
.ai-hist .nb{width:100%;justify-content:center;margin:0;height:46px;font-size:16px}
.ai-hl{flex:1;min-height:0;overflow-y:auto;margin:14px -4px 10px 0;padding-right:4px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:#3155a2 transparent}
.ai-hi{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid transparent;border-radius:12px;cursor:pointer;color:#d6e2fb;font-size:14.5px;outline:none}
.ai-hi>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-hi:hover,.ai-hi:focus-visible{background:#0f2a6a}
.ai-hi.on{background:linear-gradient(90deg,#1c5fe633,#3b4fe033);border-color:#3a78e8;box-shadow:0 0 14px #2f7bff40}
.ai-hi button{background:none;border:0;color:#8ea6d8;opacity:0;font-size:17px;padding:3px 5px;border-radius:7px;display:grid}
.ai-hi:hover button,.ai-hi.on button,.ai-hi:focus-within button{opacity:1}.ai-hi button:hover{color:#ff7a90;background:#ff7a9022}
.ai-none{color:#8ea6d8;font-size:14px;text-align:center;padding:26px 8px}
.ai-clear{background:none;border:1px solid #28489a;border-radius:11px;color:#9fb3d9;height:38px;font-size:13.5px}.ai-clear:hover{color:#ff9aa9;border-color:#a14a5c}
.ai-chat{display:flex;flex-direction:column;min-height:0;min-width:0;padding:0;overflow:hidden}
.ai-ch0{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #1c3573;flex:none}
.ai-av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ai-av) center/cover no-repeat,#0a1a4a;border:2px solid #3a78e8;box-shadow:0 0 14px #2f7bff99}
.ai-av.lg{width:46px;height:46px}
.ai-t{font-size:18px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.ai-hd{min-width:0}.ai-t,.ai-s{white-space:nowrap}.ai-s span{overflow:hidden;text-overflow:ellipsis}.ai-s{font-size:13px;color:#9fb3d9;display:flex;align-items:center;gap:7px}.ai-s i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.ai-nc{margin-left:auto!important;height:40px!important;padding:0 16px!important;font-size:15px!important}
.ai-hb{display:none;background:#0b1a47;border:1px solid #2b5cc4;border-radius:11px;width:40px;height:40px;font-size:20px;place-items:center;flex:none}
.ai-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 0 10px;scrollbar-width:thin;scrollbar-color:#3155a2 transparent;overscroll-behavior:contain}
.ai-in{max-width:880px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:18px}
.ai-m{display:flex;gap:12px;align-items:flex-start;animation:fd .25s}
.ai-m.u{flex-direction:row-reverse}
.ai-b{min-width:0;max-width:calc(100% - 52px);padding:12px 16px;border-radius:4px 16px 16px 16px;font-size:16px;line-height:1.6;overflow-wrap:anywhere;background:#0b1a47cc;border:1px solid #1f3f8f}
.ai-m.u .ai-b{background:linear-gradient(135deg,#1c5fe6,#3b4fe0);border-color:#4aa3ff;box-shadow:0 0 18px #2f7bff55;border-radius:16px 4px 16px 16px;white-space:pre-wrap}
.ai-b.err{border-color:#a14a5c;background:#2a1030cc}.ai-b.err b{color:#ff9aa9;display:block;margin-bottom:4px}
.ai-ua{flex:none;width:38px;height:38px;border-radius:50%;background:#8b5cf6;display:grid;place-items:center;font-weight:700;font-size:14px}
.ai-act{display:flex;gap:8px;margin-top:10px}
.ai-act button,.ai-retry{background:#0f2a6a;border:1px solid #2b5cc4;border-radius:9px;color:#cfe0ff;font-size:13px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px}
.ai-act button:hover,.ai-retry:hover{background:#17398a;box-shadow:0 0 12px #2f7bff66}
.ai-retry{margin-top:10px}
.md>:last-child{margin-bottom:0!important}
.md p{margin:0 0 10px}.md h2,.md h3,.md h4,.md h5{margin:14px 0 8px;line-height:1.3;font-weight:700}.md h2{font-size:21px}.md h3{font-size:18.5px}.md h4,.md h5{font-size:16.5px}
.md ul,.md ol{margin:0 0 10px;padding-left:24px}.md li{margin:3px 0}.md li>ul,.md li>ol{margin:4px 0}
.md hr{border:0;border-top:1px solid #28489a;margin:14px 0}
.md blockquote{margin:0 0 10px;padding:6px 14px;border-left:3px solid var(--c);background:#0a1a4a;border-radius:0 10px 10px 0;color:#d0dbf5}
.md a{color:#5fd2ff;text-decoration:underline;text-underline-offset:2px}
.md strong{font-weight:700;color:#fff}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:#0a1030;border:1px solid #28489a;border-radius:6px;padding:1px 6px;color:#9ff0e2}
.ai-code{margin:0 0 10px;border:1px solid #28489a;border-radius:12px;overflow:hidden;background:#050d26}
.ai-ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:#0c1d52;font-size:12.5px;color:#9fb3d9}
.ai-ch button{background:none;border:1px solid #2b5cc4;border-radius:8px;color:#cfe0ff;font-size:12px;padding:3px 9px}.ai-ch button:hover{background:#17398a}
.ai-code pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:14px;line-height:1.55}
.md .ai-code code{background:none;border:0;padding:0;color:#d9e6ff;font-size:inherit}
.ai-tw{overflow-x:auto;margin:0 0 10px}
.ai-tw table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.ai-tw th,.ai-tw td{border:1px solid #28489a;padding:7px 12px;text-align:left;vertical-align:top}.ai-tw th{background:#0c1d52;font-weight:600;white-space:nowrap}
.ai-typing{display:inline-flex;align-items:center;gap:10px;color:#9fb3d9;font-size:14.5px}
.ai-typing i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:aid 1.2s infinite ease-in-out both}
.ai-typing i:nth-child(2){animation-delay:.18s}.ai-typing i:nth-child(3){animation-delay:.36s}
@keyframes aid{0%,80%,100%{transform:scale(.45);opacity:.4}40%{transform:scale(1);opacity:1}}
.ai-wel{text-align:center;padding:0 0 6px}
.ai-logo{width:min(540px,94%);aspect-ratio:4/3;margin:0 auto;background:var(--ai-logo) center/cover no-repeat;border-radius:22px;border:1.5px solid #2b5cc4;box-shadow:0 0 34px #2f7bff55}
.ai-wel p{color:#d0dbf5;font-size:17px;margin:-4px auto 0;max-width:560px;line-height:1.55}
.ai-chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px auto 0;max-width:720px;text-align:left}
.ai-chips button{background:#0b1a47;border:1px solid #2b5cc4;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.4;color:#dbe7ff;text-align:left}
.ai-chips button:hover{border-color:#4aa3ff;box-shadow:0 0 16px #2f7bff66;background:#0f2a6a}
.ai-comp{flex:none;width:100%;max-width:920px;margin:0 auto;padding:8px 20px 14px}
.ai-box{display:flex;align-items:flex-end;gap:10px;background:#071337;border:1.5px solid #2b5cc4;border-radius:18px;padding:7px 7px 7px 16px;transition:box-shadow .2s,border-color .2s}
.ai-box:focus-within{border-color:#4aa3ff;box-shadow:0 0 20px #2f7bff66}
.ai-box textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;color:#e8efff;font-size:16px;line-height:1.5;max-height:200px;padding:8px 0;font-family:inherit}
.ai-box textarea::placeholder{color:#7e93c4}
.ai-send{flex:none;width:44px;height:44px;border-radius:13px;border:0;display:grid;place-items:center;font-size:21px;color:#fff;background:linear-gradient(90deg,#1b6df0,#16a6f2);box-shadow:0 0 18px #2f9bff88}
.ai-send:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}.ai-send.stop{background:linear-gradient(90deg,#c03a5a,#e0587a);box-shadow:0 0 18px #e0587a77}
.ai-foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:9px;font-size:12px;color:#8ea6d8;flex-wrap:wrap;text-align:center}
.ai-pw{display:inline-block;height:20px;width:152px;background:var(--ai-pw) center/contain no-repeat;flex:none}
.ai-bd{display:none}
@media(max-width:520px){.ai-nc .lbl{display:none}.ai-nc{padding:0 11px!important}}
@media(max-width:900px){
#view-ai{grid-template-columns:1fr;height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:380px}
.ai-hist{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:12;border-radius:0 22px 22px 0;transform:translateX(-105%);transition:transform .25s;padding-top:calc(14px + env(safe-area-inset-top,0px));background:#071337}
.ai-hist.open{transform:none}
.ai-bd.on{display:block;position:fixed;inset:0;background:#02071c99;z-index:11}
.ai-hb{display:grid}
.ai-ch0{padding:10px 12px;gap:10px}.ai-t{font-size:16px}.ai-s{font-size:12px}.ai-av.lg{width:40px;height:40px}
.ai-nc{padding:0 12px!important;font-size:14px!important}.ai-s .jn{display:none}
.ai-in{padding:0 12px;gap:14px}.ai-b{font-size:15px;padding:10px 13px;max-width:calc(100% - 46px)}.ai-av,.ai-ua{width:34px;height:34px}.ai-av.lg{width:40px;height:40px}
.ai-chips{grid-template-columns:1fr;gap:8px}.ai-chips button:nth-child(n+3){display:none}.ai-wel p{font-size:15px}.ai-logo{width:80%}
.ai-comp{padding:6px 10px 10px}

function md(src){let t=String(src).replace(/\r\n?/g,"\n");const blocks=[];
t=t.replace(/```([^\n`]*)\n([\s\S]*?)```/g,(m,l,c)=>{blocks.push('<div class="ai-code"><div class="ai-ch"><span>'+h(l.trim()||"kode")+'</span><button type="button" data-cc>Salin kode</button></div><pre><code>'+h(c.replace(/\n$/,""))+"</code></pre></div>");return"\n\u0002"+(blocks.length-1)+"\u0002\n"});
const L=t.split("\n"),out=[];let i=0;
const sep=s=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s||"");
const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
const li=s=>/^\s*([-*•]|\d+[.)])\s+/.test(s);
const blockStart=(a,b)=>/^\u0002\d+\u0002$/.test(a.trim())||/^#{1,4}\s+/.test(a.trim())||/^([-*_])\1{2,}$/.test(a.trim())||li(a)||/^>\s?/.test(a.trim())||(a.includes("|")&&sep(b));
while(i<L.length){const ln=L[i],T=ln.trim();if(!T){i++;continue}let m;
if(m=/^\u0002(\d+)\u0002$/.exec(T)){out.push(blocks[m[1]]);i++;continue}
if(m=/^(#{1,4})\s+(.+)$/.exec(T)){const n=m[1].length+1;out.push("<h"+n+">"+inl(m[2].replace(/\s*#+\s*$/,""))+"</h"+n+">");i++;continue}
if(/^([-*_])\1{2,}$/.test(T)){out.push("<hr>");i++;continue}
if(T.includes("|")&&sep(L[i+1])){const hd=cells(T);i+=2;const rows=[];while(i<L.length&&L[i].trim()&&L[i].includes("|")){rows.push(cells(L[i]));i++}
out.push('<div class="ai-tw"><table><thead><tr>'+hd.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");continue}
if(/^>\s?/.test(T)){const b=[];while(i<L.length&&/^\s*>\s?/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,""));i++}out.push("<blockquote>"+inl(b.join("\n")).replace(/\n/g,"<br>")+"</blockquote>");continue}
if(li(ln)){const items=[];
while(i<L.length){let k=i;while(k<L.length&&!L[k].trim())k++;if(k>i&&!(k<L.length&&li(L[k])))break;if(k>i)i=k;const mm=/^(\s*)([-*•]|(\d+)[.)])\s+(.*)$/.exec(L[i]);if(!mm)break;const d=Math.floor(mm[1].replace(/\t/g,"    ").length/2);if(items.length&&d===0&&!!mm[3]!==items[0].o)break;items.push({d,o:!!mm[3],n:mm[3],t:mm[4]});i++}
let o="";const stack=[];
for(const it of items){while(stack.length&&stack[stack.length-1].d>it.d)o+="</li></"+stack.pop().tag+">";
const top=stack[stack.length-1];
if(!top||top.d<it.d){const tag=it.o?"ol":"ul";o+="<"+tag+(it.o&&it.n!=="1"?' start="'+(+it.n)+'"':"")+"><li>"+inl(it.t);stack.push({d:it.d,tag})}else o+="</li><li>"+inl(it.t)}
while(stack.length)o+="</li></"+stack.pop().tag+">";out.push(o);continue}
const p=[];while(i<L.length&&L[i].trim()&&!(p.length&&blockStart(L[i],L[i+1]))){p.push(L[i].trim());i++}
if(!p.length){p.push(T);i++}
out.push("<p>"+p.map(inl).join("<br>")+"</p>")}
return out.join("")}

/* ---------- tampilan ---------- */
function build(){if(built)return;built=true;
root.innerHTML=`<aside class="ai-hist" id="aiHist"><button type="button" class="nb" id="aiNew">${ico("plus")}New Chat</button><div class="ai-hl" id="aiList"></div><button type="button" class="ai-clear" id="aiClear">Hapus semua riwayat</button></aside><div class="ai-bd" id="aiBd"></div>
<section class="ai-chat panel" aria-label="LEGUTI AI"><header class="ai-ch0"><button type="button" class="ai-hb" id="aiHb" aria-label="Riwayat chat">${ico("menu")}</button><div class="ai-av lg" role="img" aria-label="Joni"></div><div class="ai-hd"><div class="ai-t">LEGUTI AI</div><div class="ai-s"><i></i><span><span class="jn">Joni · </span>Your JNE Outbound Copilot</span></div></div><button type="button" class="nb g ai-nc" id="aiNew2" aria-label="Chat baru">${ico("plus")}<span class="lbl">Chat Baru</span></button></header>
<div class="ai-scroll" id="aiScroll"><div class="ai-in" id="aiMsgs" aria-live="polite"></div></div>
<div class="ai-comp"><div class="ai-box"><textarea id="aiTa" rows="1" maxlength="${MAXC}" placeholder="Tanyakan apa saja ke Joni…" aria-label="Pesan untuk LEGUTI AI" enterkeyhint="send"></textarea><button type="button" class="ai-send" id="aiSend" aria-label="Kirim" disabled>${ico("send")}</button></div><div class="ai-foot"><span>AI bisa keliru. Verifikasi informasi penting.</span><span class="ai-pw" role="img" aria-label="Powered by RITADI"></span></div></div></section>`;
const ta=q("#aiTa");
ta.addEventListener("input",()=>{fit();upd()});
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();submit()}});
q("#aiSend").onclick=()=>busy?(ctrl&&ctrl.abort()):submit();
q("#aiNew").onclick=q("#aiNew2").onclick=()=>{st.active=null;persist();drawer(false);draw();focus()};
q("#aiHb").onclick=()=>drawer(true);q("#aiBd").onclick=()=>drawer(false);
q("#aiClear").onclick=()=>{if(!st.chats.length||busy)return;if(confirm("Hapus semua riwayat chat LEGUTI AI di browser ini?")){st={chats:[],active:null};persist();drawer(false);draw()}};
root.addEventListener("click",e=>{const t=e.target.closest("[data-id],[data-del],[data-copy],[data-cc],[data-retry],[data-chip]");if(!t)return;
if(t.dataset.del){e.stopPropagation();if(busy&&pending&&pending.id===t.dataset.del)return toast("Tunggu jawaban selesai");if(confirm("Hapus percakapan ini?")){st.chats=st.chats.filter(c=>c.id!==t.dataset.del);if(st.active===t.dataset.del)st.active=null;persist();draw()}return}
if(t.dataset.id){st.active=t.dataset.id;persist();drawer(false);draw();return}
if(t.dataset.copy!==undefined){const c=cur(),m=c&&c.messages[+t.dataset.copy];if(m)copy(m.text);return}
if("cc" in t.dataset){const cd=t.closest(".ai-code").querySelector("code");copy(cd.textContent);return}
if("retry" in t.dataset){retry();return}
if(t.dataset.chip!==undefined){q("#aiTa").value=CHIPS[+t.dataset.chip];fit();upd();submit()}});
root.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("ai-hi")){e.preventDefault();e.target.click()}})}
const drawer=o=>{q("#aiHist").classList.toggle("open",o);q("#aiBd").classList.toggle("on",o)};
const fit=()=>{const ta=q("#aiTa");ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,200)+"px"};
const upd=()=>{const ta=q("#aiTa"),b=q("#aiSend");if(busy){b.disabled=false;b.classList.add("stop");b.innerHTML=ico("stop");b.setAttribute("aria-label","Hentikan");return}b.classList.remove("stop");b.innerHTML=ico("send");b.setAttribute("aria-label","Kirim");b.disabled=!ta.value.trim()};
const focus=()=>{if(!matchMedia("(pointer:coarse)").matches)q("#aiTa").focus()};
const copy=async t=>{try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.append(a);a.select();try{document.execCommand("copy")}catch(__){}a.remove()}toast("Disalin")};

function histHtml(){const l=[...st.chats].filter(c=>c.messages.length).sort((a,b)=>b.updated-a.updated);
return l.length?l.map(c=>`<div class="ai-hi ${c.id===st.active?"on":""}" data-id="${h(c.id)}" tabindex="0" role="button"><span title="${h(c.title)}">${h(c.title)}</span><button type="button" data-del="${h(c.id)}" aria-label="Hapus percakapan">${ico("trash")}</button></div>`).join(""):'<div class="ai-none">Belum ada riwayat.<br>Mulai chat baru dengan Joni.</div>'}
function msgHtml(m,i,last){
if(m.role==="user")return`<div class="ai-m u"><div class="ai-b">${h(m.text)}</div><div class="ai-ua">${h(ini())}</div></div>`;
if(m.err)return`<div class="ai-m"><div class="ai-av"></div><div class="ai-b err"><b>Joni belum bisa menjawab</b>${h(m.text)}${last?`<br><button type="button" class="ai-retry" data-retry>${ico("rs")}Coba lagi</button>`:""}</div></div>`;
return`<div class="ai-m"><div class="ai-av"></div><div class="ai-b md">${md(m.text)}<div class="ai-act"><button type="button" data-copy="${i}">${ico("copy")}Salin</button></div></div></div>`}
function welcome(){return`<div class="ai-wel"><div class="ai-logo" role="img" aria-label="LEGUTI AI — Your JNE Outbound Copilot. Powered by RITADI"></div><p>Halo, saya Joni! Tanyakan apa saja — dari operasional, laporan, rumus Excel, sampai menulis pesan.</p><div class="ai-chips">${CHIPS.map((c,i)=>`<button type="button" data-chip="${i}">${h(c)}</button>`).join("")}</div></div>`}
function draw(keep){const c=cur(),box=q("#aiMsgs");q("#aiList").innerHTML=histHtml();
box.innerHTML=c&&c.messages.length?c.messages.map((m,i)=>msgHtml(m,i,i===c.messages.length-1)).join("")+(busy&&pending===c?'<div class="ai-m"><div class="ai-av"></div><div class="ai-b"><span class="ai-typing" role="status"><i></i><i></i><i></i>Joni sedang menjawab…</span></div></div>':""):welcome();
upd();const sc=q("#aiScroll"),has=!!(c&&c.messages.length);requestAnimationFrame(()=>{sc.scrollTop=keep?sc.scrollTop:(has?sc.scrollHeight:0)})}

/* ---------- percakapan ---------- */
function ctx(c){const a=[];c.messages.filter(m=>!m.err).forEach(m=>{const l=a[a.length-1],cap=m.role==="user"?8000:12000;if(l&&l.role===m.role)l.text=(l.text+"\n\n"+m.text).slice(-cap);else a.push({role:m.role,text:m.text.slice(0,cap)})});
let r=a.slice(-20);const sum=()=>r.reduce((s,m)=>s+m.text.length,0);
while(r.length&&(r[0].role!=="user"||(sum()>38000&&r.length>1)))r.shift();return r}
function submit(){if(busy)return;const ta=q("#aiTa"),text=ta.value.trim();if(!text)return;if(text.length>MAXC)return toast("Pesan terlalu panjang");
let c=cur();if(!c){c={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:text.replace(/\s+/g," ").slice(0,42)+(text.length>42?"…":""),updated:Date.now(),messages:[]};st.chats.unshift(c);st.active=c.id;
if(st.chats.length>MAXCHATS)st.chats.sort((a,b)=>b.updated-a.updated).splice(MAXCHATS)}
if(c.messages.length>=MAXMSG)return toast("Percakapan ini sudah penuh. Mulai New Chat.");
c.messages.push({role:"user",text,ts:Date.now()});c.updated=Date.now();ta.value="";fit();persist();ask(c)}
function retry(){const c=cur();if(!c||busy)return;while(c.messages.length&&c.messages[c.messages.length-1].err)c.messages.pop();if(!c.messages.length||c.messages[c.messages.length-1].role!=="user")return draw();persist();ask(c)}
const errMsg=e=>{if(e&&e.name==="AbortError")return"Permintaan dihentikan.";if(e&&e.code){if(e.code===401)return e.msg||"Sesi berakhir. Silakan login ulang.";if(e.code===429)return(e.msg||"Terlalu banyak permintaan.")+(e.retry?` Coba lagi dalam ${e.retry} detik.`:"");if(e.code===404||e.code===405)return"Layanan AI (/api/chat) tidak ditemukan. Pastikan aplikasi sudah di-deploy di Vercel beserta folder api.";return e.msg||"Terjadi kesalahan ("+e.code+")."}
return navigator.onLine===false?"Tidak ada koneksi internet.":"Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi."};
async function ask(c){busy=true;pending=c;ctrl=new AbortController();draw();
try{const tok=window.LEGUTI_AUTH&&await window.LEGUTI_AUTH.token();if(!tok)throw{code:401,msg:"Sesi berakhir. Silakan login ulang."};
const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({messages:ctx(c)}),signal:ctrl.signal});
let j=null;try{j=await r.json()}catch(_){}
if(!r.ok)throw{code:r.status,msg:j&&j.error,retry:j&&j.retryAfter};
if(!j||typeof j.reply!=="string"||!j.reply.trim())throw{code:502,msg:"Respons kosong dari server."};
c.messages.push({role:"model",text:j.reply,ts:Date.now()})}
catch(e){c.messages.push({role:"model",text:errMsg(e),err:true,ts:Date.now()})}
finally{busy=false;pending=null;ctrl=null;c.updated=Date.now();persist();if(cur()===c)draw();else{q("#aiList").innerHTML=histHtml();upd()}}}

/* ---------- integrasi ke dashboard (tanpa mengubah fitur yang ada) ---------- */
function mount(){build();const k=uid();if(loadedFor!==k){loadedFor=k;st=load(k);if(st.active&&!cur())st.active=null}draw();focus()}
const _chrome=chrome;
chrome=function(){_chrome();const on=view==="ai";document.body.classList.toggle("ai-on",on);root.hidden=!on;if(on){document.getElementById("vx").hidden=true;mount()}else if(built)drawer(false)};
const _page=page;page=function(){if(view==="ai")return;_page()};
})();
